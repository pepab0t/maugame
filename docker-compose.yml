name: maugame

services:
  db:
    image: postgres:16
    container_name: mau_database
    environment:
      POSTGRES_USER: mauUser
      POSTGRES_PASSWORD: mauUser
      POSTGRES_DB: maugame
    networks:
      - app_network
  backend:
    image: maugame:latest
    pull_policy: build
    depends_on:
      - db
    build:
      dockerfile: ./Dockerfile
    ports:
      - "9090:9090"
    networks:
      - app_network
    environment:
      DB_URI: "jdbc:postgresql://db:5432/maugame"
      DB_USER: "mauUser"
      DB_PASSWORD: "mauUser"
      SPRING_PROFILES_ACTIVE: pre-config
      MAU_ALLOWED_ORIGINS: "https://5-189-186-149.sslip.io,http://localhost:4400,http://localhost:4200"

networks:
  app_network: