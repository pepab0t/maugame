[versions]
junit = "5.13.4"
mockito = "5.18.0"
springboot = "4.0.5"
mapstruct = "1.6.3"

[libraries]
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-platform = { module = 'org.junit.platform:junit-platform-launcher', version = '6.0.1' }
assertj = { module = "org.assertj:assertj-core", version = "3.27.3" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
lombok = { module = "org.projectlombok:lombok", version = "1.18.42" }
ulid = { module = "com.github.f4b6a3:ulid-creator", version = "5.2.3" }
slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.17" }
collections4 = { module = "org.apache.commons:commons-collections4", version = "4.5.0" }
springboot-web = { module = "org.springframework.boot:spring-boot-starter-web" }
springboot-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
springboot-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
springboot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
springboot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
springboot-security = { module = "org.springframework.boot:spring-boot-starter-security" }
springboot-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }


[bundles]
test = ["junit-api", "junit-engine", "junit-platform", "assertj", "mockito-core", "mockito-junit"]

