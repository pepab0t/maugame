plugins {
    id "java"
    id "org.springframework.boot" version libs.versions.springboot
    id "io.spring.dependency-management" version "1.1.7"
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    implementation libs.mapstruct
    annotationProcessor libs.mapstruct.processor

    implementation project(":engine")
    implementation libs.springboot.web
    implementation libs.springboot.websocket
    implementation libs.springboot.validation
    implementation libs.springboot.security
    implementation libs.springboot.jpa
    implementation libs.mapstruct
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    runtimeOnly 'org.postgresql:postgresql:42.7.9'
    runtimeOnly 'com.h2database:h2:2.4.240'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'

    testImplementation libs.springboot.test
    testImplementation libs.springboot.webflux
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
    testRuntimeOnly 'com.h2database:h2:2.4.240'

    // MapStruct
    testImplementation libs.mapstruct
    testAnnotationProcessor libs.mapstruct.processor
}
